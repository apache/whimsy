repos:
- repo: meta
  hooks:
    - id: check-hooks-apply
      name: check that hooks apply
      description: check that all the hooks apply to the repository
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
    - id: check-ast
    - id: check-builtin-literals
    - id: check-case-conflict
    - id: check-illegal-windows-names
    - id: check-json
    - id: check-merge-conflict
    - id: check-xml
    - id: check-yaml
    - id: debug-statements
    - id: detect-private-key
    - id: end-of-file-fixer
      files: \.(cgi|json|md|plist|py|rb|rdf|service|sh|template|ya?ml)$
    - id: fix-byte-order-marker
    - id: forbid-submodules
    - id: mixed-line-ending
    - id: trailing-whitespace
      files: \.(cgi|html|json|md|plist|py|rb|rdf|service|sh|template|ya?ml)$
      args: [--markdown-linebreak-ext=md]
